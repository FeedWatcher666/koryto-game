name: Apply v0.14.6 tested payload

on:
  pull_request:
    branches:
      - test/v0.14.5-playable
    types: [opened, synchronize, reopened]
    paths:
      - .bootstrap/v0146/**

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'test/v0.14.6-test10' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/v0.14.6-test10

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v0146/part-* > /tmp/v0146-payload.b64
          base64 -d /tmp/v0146-payload.b64 > /tmp/v0146-payload.tar.xz
          echo "97ca563da35a3b490938ab7e334ca3fbe1ce27270b8817e3bd38aa2ccfafa81c  /tmp/v0146-payload.tar.xz" | sha256sum -c -
          xz -t /tmp/v0146-payload.tar.xz

      - name: Apply and run complete regression suite
        shell: bash
        run: |
          set +e
          tar -xJf /tmp/v0146-payload.tar.xz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/v0142-stability.yml')
          text = path.read_text()
          text = text.replace('Koryto v0.14.5 TEST.10', 'Koryto v0.14.6 TEST.10')
          text = text.replace('test/v0.14.5-test10', 'test/v0.14.6-test10')
          text = text.replace('test/v0.14.4-playable', 'test/v0.14.5-playable')
          text = text.replace('koryto-v0.14.5-test.10', 'koryto-v0.14.6-test.10')
          path.write_text(text)
          PY
          npm test 2>&1 | tee /tmp/v0146-test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "TEST_OK=1" >> "$GITHUB_ENV"
          else
            echo "TEST_OK=0" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Commit tested payload or diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${TEST_OK:-0}" = "1" ]; then
            git checkout -- .github/workflows/v0142-stability.yml
            rm -rf .bootstrap/v0146
            git add -A
            git commit -m "v0.14.6 TEST.10: autonomous AI playtest laboratory"
          else
            git reset --hard HEAD
            git clean -fd
            mkdir -p .bootstrap/v0146
            cp /tmp/v0146-test-output.txt .bootstrap/v0146/test-output.txt
            git add .bootstrap/v0146/test-output.txt
            git commit -m "capture v0.14.6 full test failure"
          fi
          git push origin HEAD:test/v0.14.6-test10

      - name: Reject failed tests
        if: env.TEST_OK != '1'
        run: exit 1
