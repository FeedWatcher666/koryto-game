name: Patch v0.14.4 compatibility metadata

on:
  pull_request:
    branches:
      - test/v0.14.2-playable
    types: [opened, synchronize, reopened]
    paths:
      - .v0144-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'test/v0.14.4-test10' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/v0.14.4-test10

      - name: Update inherited build assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/v0143-modules.mjs')
          text = path.read_text()
          replacements = {
              r'/0\\.14\\.3 TEST\\.10/': r'/0\\.14\\.4 TEST\\.10/',
              "'0.14.3-test.10'": "'0.14.4-test.10'",
              r'/koryto-v0\\.14\\.3-test\\.10/': r'/koryto-v0\\.14\\.4-test\\.10/',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected assertion: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -f .v0144-patch-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v0143-modules.mjs .v0144-patch-trigger
          git commit -m "test: align inherited module checks with v0.14.4"
          git push origin HEAD:test/v0.14.4-test10
