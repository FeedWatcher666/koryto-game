name: Apply v0.14.4 PR payload

on:
  pull_request:
    branches:
      - test/v0.14.2-playable
    types: [opened, synchronize, reopened]
    paths:
      - .bootstrap/v0144/**

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'test/v0.14.4-test10' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/v0.14.4-test10

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v0144/part-* > /tmp/v0144-payload.b64
          base64 -d /tmp/v0144-payload.b64 > /tmp/v0144-payload.tar.xz
          xz -t /tmp/v0144-payload.tar.xz
          echo "PAYLOAD_VALID=1" >> "$GITHUB_ENV"

      - name: Apply and test payload
        if: env.PAYLOAD_VALID == '1'
        shell: bash
        run: |
          set +e
          tar -xJf /tmp/v0144-payload.tar.xz -C .
          npm test 2>&1 | tee /tmp/v0144-test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "TEST_OK=1" >> "$GITHUB_ENV"
          else
            echo "TEST_OK=0" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Commit tested payload or test diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${TEST_OK:-0}" = "1" ]; then
            cp .github/workflows/v0142-stability.yml /tmp/v0144-stability.yml
            git checkout HEAD -- .github/workflows/v0142-stability.yml
            rm -rf .bootstrap/v0144
            rm -f .github/workflows/v0144-bootstrap.yml
            git add -A
            git commit -m "v0.14.4 TEST.10: physical monolith extraction"
          else
            git reset --hard HEAD
            git clean -fd
            mkdir -p .bootstrap/v0144
            cp /tmp/v0144-test-output.txt .bootstrap/v0144/test-output.txt
            git add .bootstrap/v0144/test-output.txt
            git commit -m "capture v0.14.4 full test failure"
          fi
          git push origin HEAD:test/v0.14.4-test10

      - name: Reject failed tests
        if: env.TEST_OK != '1'
        run: exit 1
