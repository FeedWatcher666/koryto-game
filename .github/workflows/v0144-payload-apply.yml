name: Apply v0.14.4 PR payload

on:
  pull_request:
    branches:
      - test/v0.14.2-playable
    types: [opened, synchronize, reopened]
    paths:
      - .bootstrap/v0144/**

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'test/v0.14.4-test10' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/v0.14.4-test10

      - name: Reconstruct, verify and test payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v0144/part-* | base64 -d > /tmp/v0144-payload.tar.xz
          xz -t /tmp/v0144-payload.tar.xz
          tar -xJf /tmp/v0144-payload.tar.xz -C .
          rm -rf .bootstrap/v0144
          rm -f .github/workflows/v0144-bootstrap.yml
          npm test

      - name: Commit exact tested payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.14.4 TEST.10: physical monolith extraction"
          git push origin HEAD:test/v0.14.4-test10
