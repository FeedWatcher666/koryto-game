name: Koryto clean rewrite

on:
  push:
    branches:
      - agent/v0200-clean-rewrite
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run clean runtime tests
        run: npm test

      - name: Check source syntax
        run: npm run check

      - name: Verify no legacy or hand-maintained runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/app.js
          test ! -e src/v0174-style-stabilization.js
          test ! -e src/runtime.js
          ! grep -R -E 'v017|KorytoApp|village-rpg|legacy=1' index.html src styles

      - name: Build deterministic offline artifact
        run: node scripts/build-offline.mjs

      - name: Verify offline artifact contract
        shell: bash
        run: |
          set -euo pipefail
          target="dist/koryto-v0.20.0-clean-test.5"
          test -f "$target/index.html"
          test -f "$target/src/runtime.js"
          test -f "$target/styles/game.css"
          test -f "$target/styles/dice3d.css"
          grep -q 'src/runtime.js' "$target/index.html"
          grep -q 'data-d20-renderer="icosahedron"' "$target/src/runtime.js"
          grep -q '2d20kh1' "$target/src/runtime.js"
          grep -q '2d20kl1' "$target/src/runtime.js"
          grep -q 'HODÍTE 2 KOSTKY' "$target/src/runtime.js"
          grep -q 'POČÍTÁ SE VYŠŠÍ ČÍSLO' "$target/src/runtime.js"
          grep -q 'POČÍTÁ SE NIŽŠÍ ČÍSLO' "$target/src/runtime.js"
          grep -q 'CO SE STALO S KOSTKAMI' "$target/src/runtime.js"
          ! grep -R -E 'v017|KorytoApp|village-rpg|legacy=1' "$target/index.html" "$target/src" "$target/styles"

      - name: Install Chromium browser gate
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Test understandable 2d20 in packaged build
        run: node tests/browser.mjs dist/koryto-v0.20.0-clean-test.5

      - name: Upload D20 explanation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.20.0-clean-test.5-d20-screenshots
          path: browser-artifacts
          if-no-files-found: warn

      - name: Upload playable offline build
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.20.0-clean-test.5
          path: dist/koryto-v0.20.0-clean-test.5
          if-no-files-found: error
