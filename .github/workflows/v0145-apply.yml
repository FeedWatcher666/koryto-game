name: Apply v0.14.5 tested payload

on:
  pull_request:
    branches:
      - test/v0.14.4-playable
    types: [opened, synchronize, reopened]
    paths:
      - .bootstrap/v0145/**

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'test/v0.14.5-test10' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test/v0.14.5-test10

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v0145/part-* > /tmp/v0145-payload.b64
          base64 -d /tmp/v0145-payload.b64 > /tmp/v0145-payload.tar.xz
          echo "84cdef51fc5e2dea0f4dde0f459b24929e3ac403b70813d06ff38d2919ea2c9b  /tmp/v0145-payload.tar.xz" | sha256sum -c -
          xz -t /tmp/v0145-payload.tar.xz
          echo "PAYLOAD_OK=1" >> "$GITHUB_ENV"

      - name: Apply and test payload
        if: env.PAYLOAD_OK == '1'
        shell: bash
        run: |
          set +e
          tar -xJf /tmp/v0145-payload.tar.xz -C .
          sed -i "s/context.KorytoReleaseCandidate.VERSION,'0.14.5 TEST.10'/context.KorytoReleaseCandidate.VERSION,'0.14.4 TEST.10'/" tests/v0143-test10.mjs
          npm test 2>&1 | tee /tmp/v0145-test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "TEST_OK=1" >> "$GITHUB_ENV"
          else
            echo "TEST_OK=0" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Commit tested payload or diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${TEST_OK:-0}" = "1" ]; then
            rm -rf .bootstrap/v0145
            git add -A
            git commit -m "v0.14.5 TEST.10: playable campaign and tester build"
          else
            git reset --hard HEAD
            git clean -fd
            mkdir -p .bootstrap/v0145
            cp /tmp/v0145-test-output.txt .bootstrap/v0145/test-output.txt
            git add .bootstrap/v0145/test-output.txt
            git commit -m "capture v0.14.5 full test failure"
          fi
          git push origin HEAD:test/v0.14.5-test10

      - name: Reject failed tests
        if: env.TEST_OK != '1'
        run: exit 1
