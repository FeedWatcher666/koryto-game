name: Repository security

on:
  pull_request:
  push:
    branches:
      - agent/v0200-clean-rewrite
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Block vulnerable dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  actions-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Audit GitHub Actions with zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
      - name: Explain advisory status
        run: echo "zizmor is advisory until all third-party and official actions are SHA-pinned; dependency review remains blocking."
