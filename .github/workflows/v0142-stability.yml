name: Koryto v0.14.2 RC1

on:
  push:
    branches:
      - test/v0.14.2-playable
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.14.2-rc1-diagnostics
          path: test-output.txt
          if-no-files-found: warn

      - name: Build offline package
        run: |
          mkdir -p dist/koryto-v0.14.2-rc1
          cp index.html VERSION README.md dist/koryto-v0.14.2-rc1/
          cp -R src styles dist/koryto-v0.14.2-rc1/

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.14.2-rc1
          path: dist/koryto-v0.14.2-rc1
          if-no-files-found: error
