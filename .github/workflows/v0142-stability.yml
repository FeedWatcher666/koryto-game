name: Koryto v0.18.0 TEST.1

on:
  push:
    branches:
      - agent/v0180-vertical-slice
  pull_request:
    branches:
      - agent/v0174-style-stabilization
      - agent/v0173-playability-reset
      - agent/v0172-turn-clarity
      - agent/v0171-decision-hud
      - agent/v0170-visual-foundation
      - agent/v0160-clean-ui
      - fix/pr19-v0149-wiring
      - test/v0.14.8-playable
      - main
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.18.0-test.1-diagnostics
          path: test-output.txt
          if-no-files-found: warn

      - name: Build offline package
        shell: bash
        run: |
          set -euo pipefail
          build_version="$(cat VERSION)"
          test "$build_version" = "0.18.0-test.1"
          target="dist/koryto-v${build_version}"
          mkdir -p "$target"
          cp index.html VERSION README.md "$target/"
          cp -R src styles assets "$target/"
          mkdir -p "$target/docs/v0.14" "$target/docs/v0.16" "$target/docs/v0.17" "$target/docs/v0.18"
          cp docs/v0.14/v0146-playtest-report.md "$target/docs/v0.14/"
          cp docs/v0.14/v0147-consequence-report.md "$target/docs/v0.14/"
          cp docs/v0.16/v0160-clean-ui.md "$target/docs/v0.16/"
          cp docs/v0.16/v0161-layout-polish.md "$target/docs/v0.16/"
          cp docs/v0.16/v0162-playtest.md "$target/docs/v0.16/"
          cp docs/v0.16/v0163-staff-polish.md "$target/docs/v0.16/"
          cp docs/v0.16/v0165-audit.md "$target/docs/v0.16/"
          cp docs/v0.16/v0166-day-debate.md "$target/docs/v0.16/"
          cp docs/v0.16/v0166-browser-smoke.md "$target/docs/v0.16/"
          cp docs/v0.16/v0167-election-coalition.md "$target/docs/v0.16/"
          cp docs/v0.16/v0168-onboarding.md "$target/docs/v0.16/"
          cp docs/v0.16/v0169-release-polish.md "$target/docs/v0.16/"
          cp docs/v0.16/v0169-test3.md "$target/docs/v0.16/"
          cp docs/v0.17/v0170-visual-foundation.md "$target/docs/v0.17/"
          cp docs/v0.17/v0171-decision-hud.md "$target/docs/v0.17/"
          cp docs/v0.17/v0172-turn-clarity.md "$target/docs/v0.17/"
          cp docs/v0.17/v0173-playability-reset.md "$target/docs/v0.17/"
          cp docs/v0.17/v0174-style-stabilization.md "$target/docs/v0.17/"
          cp docs/v0.18/v0180-vertical-slice.md "$target/docs/v0.18/"
          rm -f "$target/src/v0142-rc2.js" "$target/src/v0142-rc3.js"

          test -f "$target/src/build-info.js"
          test -f "$target/src/v0174-style-stabilization.js"
          test -f "$target/src/v0180-vertical-slice.js"
          test -f "$target/styles/v0174-style-stabilization.css"
          test -f "$target/styles/v0180-vertical-slice.css"
          test -f "$target/docs/v0.18/v0180-vertical-slice.md"
          test -f "$target/assets/v0164/map-pixel-cartoon.webp"
          test -f "$target/assets/v0165/manifest.json"

          grep -q 'viewport-fit=cover' "$target/index.html"
          grep -q 'Koryto 0.18.0 TEST.1' "$target/index.html"
          grep -q 'src/v0180-vertical-slice.js' "$target/index.html"
          grep -q 'styles/v0180-vertical-slice.css' "$target/index.html"
          grep -q 'src/v0174-style-stabilization.js' "$target/index.html"
          grep -q 'styles/v0174-style-stabilization.css' "$target/index.html"
          if grep -R -E 'https?://(fonts|cdn|unpkg|jsdelivr)' "$target/index.html" "$target/styles" "$target/src"; then
            echo "Release contains a forbidden network dependency" >&2
            exit 1
          fi

      - name: Install Chromium gate dependency
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Browser gate on packaged artifact
        shell: bash
        run: |
          node tests/v0180-browser-gate.mjs dist/koryto-v0.18.0-test.1

      - name: Upload browser gate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.18.0-test.1-browser-gate
          path: browser-artifacts
          if-no-files-found: warn

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.18.0-test.1
          path: dist/koryto-v0.18.0-test.1
          if-no-files-found: error
