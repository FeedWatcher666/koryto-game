name: Koryto v0.14.2 stability

on:
  push:
    branches:
      - test/v0.14.2-playable
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build offline package
        run: |
          mkdir -p dist/koryto-v0.14.2-test.7
          cp index.html VERSION README.md dist/koryto-v0.14.2-test.7/
          cp -R src styles dist/koryto-v0.14.2-test.7/

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.14.2-test.7
          path: dist/koryto-v0.14.2-test.7
          if-no-files-found: error
