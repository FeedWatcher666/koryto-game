name: Koryto v0.15.2 TEST.1

on:
  push:
    branches:
      - test/v0.15.2-reference-match
  pull_request:
    branches:
      - test/v0.15.0-test1-visual-foundation
      - fix/pr19-v0149-wiring
      - test/v0.14.8-playable
      - main
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.15.2-test.1-diagnostics
          path: test-output.txt
          if-no-files-found: warn
      - name: Build offline package
        shell: bash
        run: |
          set -euo pipefail
          target=dist/koryto-v0.15.2-test.1
          mkdir -p "$target"
          cp index.html VERSION README.md "$target/"
          cp -R src styles assets "$target/"
          mkdir -p "$target/docs/v0.14" "$target/docs/v0.15"
          cp docs/v0.14/v0146-playtest-report.md "$target/docs/v0.14/"
          cp docs/v0.14/v0147-consequence-report.md "$target/docs/v0.14/"
          cp docs/v0.15/v0150-visual-identity.md "$target/docs/v0.15/"
          cp docs/v0.15/v0152-reference-match.md "$target/docs/v0.15/"
          rm -f "$target/src/v0142-rc2.js" "$target/src/v0142-rc3.js"
          test "$(cat "$target/VERSION")" = "0.15.2-test.1"
          test -f "$target/styles/v0150.css"
          test -f "$target/styles/v0151.css"
          test -f "$target/styles/v0152.css"
          test -f "$target/src/v0150-visual-foundation.js"
          test -f "$target/src/v0151-graphics.js"
          test -f "$target/src/v0152-reference-match.js"
          test -f "$target/assets/v0152/map.webp"
          test -f "$target/assets/v0152/staff.webp"
          test -f "$target/assets/v0152/event.webp"
          test -f "$target/assets/v0152/debate.webp"
          test -f "$target/assets/v0152/coalition.webp"
          test -f "$target/assets/v0151/portrait-brazda.webp"
          test -f "$target/assets/v0151/portrait-candidate.webp"
          test -f "$target/assets/v0151/portrait-daniela.webp"
          test -f "$target/assets/v0151/portrait-bohumil.webp"
          test -f "$target/assets/v0151/portrait-holub.webp"
          grep -q 'styles/v0151.css' "$target/index.html"
          grep -q 'styles/v0152.css' "$target/index.html"
          grep -q 'src/v0151-graphics.js' "$target/index.html"
          grep -q 'src/v0152-reference-match.js' "$target/index.html"
          if grep -R -E 'https?://(fonts|cdn|unpkg|jsdelivr)' "$target/index.html" "$target/styles" "$target/src"; then
            echo "Release contains a forbidden network dependency" >&2
            exit 1
          fi
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: koryto-v0.15.2-test.1
          path: dist/koryto-v0.15.2-test.1
          if-no-files-found: error
