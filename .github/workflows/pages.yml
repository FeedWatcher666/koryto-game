name: Publish Koryto tester build

on:
  push:
    branches:
      - test/v0.14.5-playable
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tester build
        run: npm test
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html VERSION README.md _site/
          cp -R src styles _site/
          touch _site/.nojekyll
          rm -f _site/src/v0142-rc2.js _site/src/v0142-rc3.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
