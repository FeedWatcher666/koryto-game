name: Deploy green Koryto tester

on:
  workflow_run:
    workflows:
      - Koryto clean rewrite
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: koryto-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact green commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build offline tester
        run: node scripts/build-offline.mjs
      - name: Prepare Pages root
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R dist/koryto-v0.20.0-clean-test.7 _site
          touch _site/.nojekyll
          cat > _site/tester-build.json <<JSON
          {
            "version": "0.20.0-clean-test.7",
            "commit": "${TESTED_SHA}",
            "workflowRun": "${TESTED_RUN_ID}"
          }
          JSON
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tester
        id: deployment
        uses: actions/deploy-pages@v4
