name: Patch TEST.3 k165 build identity

on:
  pull_request:
    branches:
      - fix/pr19-v0149-wiring
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0160-clean-ui
          fetch-depth: 0

      - name: Remove legacy k165 title writer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/v0165-campaign-ui.js')
          source = path.read_text()
          old = '    document.title = `Koryto ${VERSION} – ${view === "location" ? "lokalita" : view === "event" ? "událost" : view === "result" ? "výsledek" : "kauzy"}`;\n'
          new = '    globalThis.KorytoBuildInfo?.applyLabels?.();\n'
          if old not in source:
              raise SystemExit('legacy k165 title writer not found')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check src/v0165-campaign-ui.js

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v0165-campaign-ui.js
          git commit -m 'v0.16.9 TEST.3: keep k165 surfaces on canonical build identity'
          git push origin HEAD:agent/v0160-clean-ui
